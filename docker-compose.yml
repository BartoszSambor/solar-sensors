services:
  db:
    image: postgres:17
    restart: always
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # IoT sensor simulator; the frontend nginx routes /simulator/ to it. It sends
  # measurements to the app's public HTTPS address, like a real device.
  simulator:
    build: ./simulator
    restart: always
    environment:
      # Addresses it may send to (comma-separated, first is the default).
      API_URLS: ${SIMULATOR_API_URLS:-https://host.docker.internal}
      # false only locally: the localhost certificate comes from Caddy's own CA.
      TLS_VERIFY: ${SIMULATOR_TLS_VERIFY:-false}
    extra_hosts:
      # Locally the app is reached through the host: https://host.docker.internal.
      - host.docker.internal:host-gateway

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
      - simulator

  caddy:
    image: caddy:2.10-alpine
    restart: always
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost, host.docker.internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
