repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^frontend/src/client/
      - id: trailing-whitespace
        exclude: ^frontend/src/client/

  # Backend tools run from backend/.venv, so their versions come from uv.lock.
  - repo: local
    hooks:
      # The simulator has no tool config of its own; it uses the backend's.
      - id: ruff
        name: ruff (backend, simulator)
        entry: bash -c "cd backend && uv run ruff check --config pyproject.toml --fix --exit-non-zero-on-fix . ../simulator && uv run ruff format --config pyproject.toml . ../simulator"
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy (backend, simulator)
        entry: bash -c "cd backend && uv run mypy app scripts && uv run mypy ../simulator/app.py"
        language: system
        types: [python]
        pass_filenames: false
      - id: er-diagram
        name: ER diagram (docs/database.mmd)
        entry: bash -c "cd backend && uv run python -m scripts.er_diagram"
        language: system
        files: ^(backend/app/.*models\.py|backend/scripts/er_diagram\.py|docs/database\.mmd)$
        pass_filenames: false
      - id: biome
        name: biome (frontend)
        entry: bash -c "cd frontend && npx biome check src"
        language: system
        files: ^frontend/src/
        pass_filenames: false
      - id: tsc
        name: tsc (frontend)
        entry: bash -c "cd frontend && npx tsc --noEmit"
        language: system
        files: ^frontend/src/
        pass_filenames: false
